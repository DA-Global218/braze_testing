<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Braze Web Playground</title>
</head>
<body>
  <h1>Braze Web SDK Playground</h1>
  <p>打开浏览器控制台可以看到 Braze 日志。</p>

  <!-- 1. 引入 Braze Web SDK（CDN） -->
  <script src="https://js.appboycdn.com/web-sdk/5.4/braze.min.js"></script>
  <script>
    // 2. 初始化 SDK：用你当前 Web App 的 API Key + SDK Endpoint
    braze.initialize("49f1ee81-af3e-4afc-8158-0f4192fed5eb", {
      baseUrl: "sdk.fra-02.braze.eu",
      enableLogging: true,                 // 练习环境建议先开日志
      allowUserSuppliedJavascript: false   // 先关掉自定义 HTML JS，后面需要再开
    });

    // 3. 自动展示 In-App Messages（不用自己写 listener）
    braze.automaticallyShowInAppMessages();

    // 4. 设定一个当前用户 ID（建议：你的邮箱 / 工号）
    braze.changeUser("67ece7ebd8dc9d0056cec6ba");

    // 5. 开 Session（必须在 changeUser 之后）
    braze.openSession();

    // 可选：打一个自定义事件，方便在 Braze 里筛选
    braze.logCustomEvent("web_playground_loaded");
  </script>
</body>

</html>
